services:
  postgres:
    build:
      context: postgres
    container_name: camunda-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - application
      - developer
    ports:
      - "4444:5432"



  tomcat-app:
    build:
      context: tomcat-app
    restart: unless-stopped
    environment:
      # ${...} of conf/context.xml are read from the environment
      JAVA_OPTS: -Dorg.apache.tomcat.util.digester.PROPERTY_SOURCE=org.apache.tomcat.util.digester.EnvironmentPropertySource
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GATEWAY_URL: http://nginx-gateway
    depends_on:
      postgres:
        condition: service_healthy
      nginx-gateway:
        condition: service_started
    volumes:
      # app-back.war (built by maven into ../artifact/back)
      - ../artifact/back/:/usr/local/tomcat/webapps/
    ports:
      # direct access for dev (vite reverse proxy /api)
      - "9082:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf -o /dev/null http://localhost:8080/app-back/api/images" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - public
      - application
  tomcat-int:
    build:
      context: tomcat-int
    restart: unless-stopped
    volumes:
      - ../artifact/proxy/:/usr/local/tomcat/webapps/
    ports:
      - "9080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf -o /dev/null http://localhost:8080/image-adapter" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - integration
      - application

  nginx-ingress:
    build:
      context: nginx-ingress
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-90}:80"
    volumes:
      # folder with vuejs app
      - ../artifact/front:/app/front/:ro
    depends_on:
      - tomcat-app
    networks:
      - public
      - application

  nginx-gateway:
    build:
      context: nginx-gateway
    container_name: nginx-gateway
    restart: unless-stopped
    ports:
      - "9081:80"
    networks:
      - application
      - integration

networks:
  public:
    driver: bridge
  front:
    internal: true
  application:
    internal: true
  integration:
    driver: bridge
  developer:
    driver: bridge

