# type d'animal: cat
# ressources: images/cataas, images/placekitten
#
# tomcat-int est un adaptateur : il répond 502 si le serveur final est indisponible.
# Chaque ressource est exposée par un serveur nginx interne (socket unix) pour que
# l'upstream "cat" la voie comme un serveur distinct (round robin + failover).

# --- limite de 3 connexions par ressource vers tomcat-int ---
upstream cat-cataas {
    zone cat-cataas 64k;
    server tomcat-int:8080 max_conns=3;
}
upstream cat-placekitten {
    zone cat-placekitten 64k;
    server tomcat-int:8080 max_conns=3;
}

# --- serveurs internes (un par ressource) ---
server {
    listen unix:/run/nginx/cat-cataas.sock;
    location / {
        proxy_set_header Host tomcat-int;
        proxy_pass http://cat-cataas/image-adapter/api/images/cataas;
    }
}
server {
    listen unix:/run/nginx/cat-placekitten.sock;
    location / {
        proxy_set_header Host tomcat-int;
        proxy_pass http://cat-placekitten/image-adapter/api/images/placekitten;
    }
}

# --- round robin + failover entre les ressources ---
upstream cat {
    zone cat 64k;
    # max_fails/fail_timeout : une ressource en erreur est écartée 10s
    server unix:/run/nginx/cat-cataas.sock      max_conns=3 max_fails=1 fail_timeout=10s;
    server unix:/run/nginx/cat-placekitten.sock max_conns=3 max_fails=1 fail_timeout=10s;
}
