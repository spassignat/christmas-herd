# round robin + failover entre toutes les ressources "cat"
location = /proxy/cat {
    proxy_pass http://cat/;
}

# appel direct d'une ressource particulière (pas de failover)
location = /proxy/cat/cataas {
    proxy_pass http://unix:/run/nginx/cat-cataas.sock:/;
}
location = /proxy/cat/placekitten {
    proxy_pass http://unix:/run/nginx/cat-placekitten.sock:/;
}
