# upstreams (un fichier par type d'animal)
include /etc/nginx/backends/*.upstream.conf;

server {
    listen 80 default_server;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # failover : on passe au serveur suivant si erreur / timeout / 5xx
    proxy_connect_timeout   5s;
    proxy_read_timeout      30s;
    proxy_next_upstream     error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    # upstream(s) tried, the last one served the image (used by app-back to record the source)
    add_header X-Upstream $upstream_addr always;

    # locations (un fichier par type d'animal), exposées sous /proxy/<type>/*
    include /etc/nginx/backends/*.location.conf;

    location / {
        return 404;
    }
}
